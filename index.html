<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- viewport-fit=cover so the app can sit under the Android gesture bar
         once installed; interactive-widget keeps the keyboard from shoving
         the whole layout up when entering a weight mid-set. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Workout tracker — templates, live logging, and progress insights." />
    <title>ez-workout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
