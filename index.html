<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- viewport-fit=cover so the app can sit under the Android gesture bar
         once installed; interactive-widget keeps the keyboard from shoving
         the whole layout up when entering a weight mid-set. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Workout tracker — templates, live logging, and progress insights." />
    <title>ez-workout</title>
  </head>
  <body>
    <script>
      // Runs before first paint. Without it a dark-mode user sees a white
      // flash on every load, which no amount of React can fix afterwards.
      try {
        var stored = localStorage.getItem('workout-theme');
        var dark = stored === 'dark' || (stored !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) { /* storage unavailable; the app applies the theme on mount */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
