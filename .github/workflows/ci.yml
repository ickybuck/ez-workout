name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The type and lint backlogs are inherited from the app's bolt.new
      # origin. The ratchet fails only when a count increases, so the backlog
      # can be burned down incrementally without the build being red for
      # months — see scripts/quality-ratchet.mjs.
      - name: Quality ratchet
        run: npm run ratchet

      # Unlike the ratchet, this is a hard gate: tests must pass, not merely
      # not-get-worse. There is no backlog of failing tests to work down.
      - name: Tests
        run: npm test

      # Vite does not typecheck, so this catches a genuinely different class
      # of failure to the step above: anything that breaks the actual bundle.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
