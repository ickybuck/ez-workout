name: Build and publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ickybuck/ez-workout

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Two tags on purpose. The sha- tag is immutable and is what makes
          # rollback trustworthy — it always means exactly one commit. The
          # :main tag moves, so the NAS app can point at it once and pick up
          # each new build on redeploy instead of needing its image tag
          # edited by hand every release. Which commit is actually running
          # stays knowable either way, via the revision label below.
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/ickybuck/ez-workout
            org.opencontainers.image.revision=${{ github.sha }}
