server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html is the one file that must never be cached, because it is the
    # only thing that names the current build. Everything under /assets/ is
    # content-hashed and pinned for a year, which is safe precisely because a
    # changed file gets a changed name — but the shell that points at those
    # names has a stable URL, so a cached copy keeps pointing at the previous
    # build forever.
    #
    # Until now it carried NO Cache-Control at all, which is worse than it
    # sounds: with no explicit header browsers fall back to heuristic caching
    # off Last-Modified, so a freshly deployed build can go unseen for hours
    # with nothing in the response to explain why. Observed directly — the
    # origin was serving a new bundle while a browser kept loading the old one
    # and there was no service worker involved to blame.
    #
    # no-cache rather than no-store, deliberately, and the distinction matters
    # here. no-cache means "store it, but revalidate before use", so the ETag
    # already being sent turns almost every load into a cheap 304 rather than a
    # full transfer. The Cloudflare hazard documented below applies to .js,
    # which is in Cloudflare's default static-extension set; HTML is not cached
    # at the edge by default, so it does not have the same problem.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # These must never be cached hard, and they are matched BEFORE the
    # fingerprinted-asset rule below because nginx tries exact-match `=` and
    # then regex locations in order.
    #
    # sw.js is a .js file at the root, so the immutable rule below would
    # otherwise pin the service worker for a year and autoUpdate would never
    # fire — the app would keep serving a build from whenever the browser
    # first saw it. registerSW.js and the manifest have the same problem.
    # Note: `expires` emits its own Cache-Control, so pairing it with an
    # add_header sends the header twice. Setting it once, explicitly, avoids
    # leaving intermediaries to pick.
    # no-store, not no-cache. This sits behind Cloudflare, which will happily
    # edge-cache a "no-cache" response and then serve that copy to a browser
    # that is explicitly revalidating — so a new service worker went unnoticed
    # for up to Cloudflare's own TTL, and the app kept serving the previously
    # precached shell. Observed: an explicit registration.update() found no
    # new version while the origin was already serving the next build.
    # no-store keeps it out of the edge cache entirely.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    # Everything under /assets/ is content-hashed by Vite, so a long immutable
    # cache is safe: a changed file gets a changed name.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
